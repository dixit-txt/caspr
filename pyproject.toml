[project]
name = "caspr-core"
version = "0.1.0"
requires-python = ">=3.14.5"
dependencies = [
    "aioboto3>=15.5.0",
    "aiofiles>=25.1.0",
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "boto3>=1.40.61",
    "botocore>=1.40.61",
    "chardet>=7.6.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "google-auth>=2.57.0",
    "google-genai>=2.21.0",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.1",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "mammoth>=1.12.1",
    "markdown>=3.10.3",
    "mcp>=2.1.1",
    "openai>=3.7.0",
    "opensearch-py>=3.2.0",
    "pandas>=3.0.5",
    "passlib[argon2]>=1.7.4",
    "pillow>=10.4.0",
    "pydantic>=2.13.5",
    "python-dateutil>=2.9.0.post0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-jose>=3.5.0",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "requests-aws4auth>=1.3.2",
    "sqlalchemy>=2.0.52",
    "starlette>=1.6.0",
    "textract>=2.1.0",
    "uuid-utils>=0.17.0",
    "uvicorn>=0.52.4",
    "weasyprint>=69.0",
]

[tool.uv]
# R-STRUCT-2 / R-UV-1: the project is an installed package, so `src/app` is
# imported from the environment rather than picked up off the working
# directory. That is what stops "passes locally, ModuleNotFoundError in the
# container".
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "mypy>=2.3.1",
    "nbclient>=0.11.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16",
]

# --- R-TOOL-1: Ruff owns lint and format. Rules are selected explicitly so a
# --- Ruff upgrade cannot silently change what CI enforces.
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "ASYNC",    # blocking calls in async def       <- R-FA-4
    "S",        # bandit security rules             <- R-SEC-1
    "T20",      # flake8-print                      <- R-LOG-1
    "RUF",
]
ignore = [
    "E501",  # the formatter owns line length
    # ---- Migration debt register -------------------------------------------
    # Every code below is a real finding that requires a *logic* change to
    # resolve, which the R-STRUCT-1 structural migration was explicitly not
    # permitted to make (spec §8). They are listed with counts measured at the
    # end of that migration so progress is visible. Remove entries as they are
    # fixed; do not add to this list.
    "E402",    # 205 - imports below module top; mostly deliberate lazy imports
               #       breaking real circular dependencies. Fixing means
               #       untangling those cycles.
    "RUF013",  # 77  - implicit Optional in signatures. Making them explicit
               #       changes public function signatures.
    "E712",    # 49  - `== True` comparisons, several inside SQLAlchemy filter
               #       expressions where `is True` would change the generated
               #       SQL. Needs case-by-case review, not a blanket fix.
    "RUF006",  # 47  - asyncio.create_task results not retained, so tasks can be
               #       garbage-collected mid-flight. A genuine latent bug class,
               #       and the correct fix is Celery (R-BG-1), already deferred.
    "T201",    # 36  - print() calls (R-LOG-1). Removed when structlog lands.
    "B008",    # 28  - function call in argument default; the FastAPI Depends()
               #       idiom, resolved by the Annotated aliases (R-FA-2) as they
               #       replace the remaining inline call sites.
    "B904",    # 14  - raise-without-from inside except; changes tracebacks.
    "S110",    # 10  - try/except/pass (R-CORE-4). Each needs a real handler.
    "F841",    # 19  - unused locals; several are deliberate `_ =` style holds.
    "RUF001", "RUF002", "RUF003",  # 39 - ambiguous Unicode in existing copy.
    "SIM105", "SIM108", "SIM401", "RUF005",  # 31 - readability rewrites.
    "S311",    # 3   - non-crypto random; needs review of each call site.
    "E722",    # 3   - bare except.
    "UP035",   # 4   - deprecated typing imports.
    "W291", "W293",  # 52 - trailing/blank-line whitespace occurring *inside*
               #       triple-quoted strings: SQL statements, email HTML
               #       templates, and LLM prompt text. `ruff format` correctly
               #       leaves string contents alone, and stripping whitespace
               #       from a prompt or a SQL literal changes behaviour.
    "B007",    # 4   - unused loop control variable.
    "RUF012",  # 2   - mutable class default needs ClassVar annotation.
    "B905",    # 2   - zip() without explicit strict=.
    "ASYNC240", # 1  - blocking Path method in async def (R-FA-4). Real, needs
               #       run_in_threadpool, which is a logic change.
    "B025",    # 1   - duplicate exception in try block.
    "S105",    # 1   - hardcoded string flagged as a password.
    "B006",    # 1   - mutable argument default.
    "SIM115",  # 1   - file opened without a context manager.
    "RUF059",  # 1   - unpacked variable unused; removing it changes a tuple
               #       unpack, which is a logic edit.
    "UP042",   # 1   - `class Functionality(str, Enum)` should be StrEnum.
               #       Switching base classes changes serialisation behaviour.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"db_migrations/**" = ["E501", "I001"]
# Debt register. Each entry names a module that needs a logic pass the
# structural migration is not permitted to make. Shrink this list, never
# extend it. See docs/superpowers/specs/2026-09-03-caspr-core-rulebook-alignment-design.md
"src/app/core/constants.py" = ["S105", "S106"]
"src/app/research/**" = ["S", "B", "SIM", "ASYNC", "T20"]
"src/app/observability/**" = ["S", "B", "SIM", "T20"]

# --- R-TOOL-2: mypy strict is a merge gate.
[tool.mypy]
python_version = "3.14"
# Without mypy_path the src/ layout makes modules resolve as `src.app.*`, and
# every `module = ["app.*"]` override below silently fails to match.
mypy_path = "src"
explicit_package_bases = true
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = true
exclude = ["db_migrations/versions/"]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true

# ---- Debt register (R-TOOL-2) -------------------------------------------
# `strict = true` above is a REAL gate. It applies to every module in the
# service except the ones listed here, which carry the pre-existing type debt
# of code the R-STRUCT-1 migration relocated but was not permitted to rewrite.
# Annotating ~62,000 lines is its own project (see spec section 5).
#
# This list is the metric, and it should only ever shrink. Do not add a new
# module to it — make the module type-clean instead.
#
# Measured at the end of the structural migration: 74 modules,
# 1671 errors.
[[tool.mypy.overrides]]
module = [
    "app.adapters.cloudwatch",
    "app.adapters.email",
