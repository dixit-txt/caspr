# --- R-TEST-1, R-TEST-2
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = ["unit", "integration", "e2e", "smoke"]
testpaths = ["tests"]
